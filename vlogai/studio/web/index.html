<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vlogai studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
    <span>vlogai</span>
  </div>
  <label class="proj">
    <span class="sr">项目</span>
    <select id="projectSelect" aria-label="当前项目"></select>
  </label>
  <nav class="steps" aria-label="步骤" id="steps"></nav>
  <div class="top-right">
    <label class="mock" title="离线模拟：不调用 AI、不花钱，用来测试流程">
      <input type="checkbox" id="mockToggle"> 离线模拟
    </label>
    <span class="pill" id="keyState"></span>
  </div>
</header>

<main id="app"></main>

<div id="jobPanel" class="job" hidden>
  <div class="job-head">
    <span class="spinner" aria-hidden="true"></span>
    <strong id="jobName"></strong>
    <span id="jobLast" class="job-last"></span>
    <button type="button" class="ghost sm" id="jobToggle">日志</button>
    <button type="button" class="ghost sm" id="jobClose" aria-label="关闭">×</button>
  </div>
  <div class="bar" id="jobBar"><i id="jobFill"></i></div>
  <pre id="jobLog" class="job-log mono" hidden></pre>
</div>

<dialog id="modal"><form method="dialog" id="modalBody"></form></dialog>

<script src="/static/app.js"></script>
</body>
</html>
